services:
  fuseki:
    build:
      context: .
      dockerfile: Dockerfile.fuseki
    ports:
      - "3030:3030"
    volumes:
      - type: bind
        source: ${BREATHEMADRID_RDF:-./data/airquality.ttl}
        target: /data/airquality.ttl
        read_only: true
        bind:
          create_host_path: false
    command: ["--file=/data/airquality.ttl", "/breathemadrid"]
