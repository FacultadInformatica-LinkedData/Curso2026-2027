<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madrid Green Spaces | Grupo 02</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="masthead"><div class="shell head-row"><div class="identity"><span class="brand-mark" aria-hidden="true">♣</span><div><strong>Madrid Green Spaces</strong></div></div></div></header>
<main class="shell">
  <section class="hero"><div><div class="eyebrow">EXPLORADOR DE PARQUES</div><h1>Descubre los espacios verdes de Madrid</h1></div><div class="hero-icon" aria-hidden="true">🌳</div></section>
  <section class="panel filters"><h2>Buscar parques</h2><form id="search-form" class="search-row"><label>Nombre del parque<input id="name" type="search" placeholder="Por ejemplo, Retiro" autocomplete="off"></label><label>Distrito<select id="district"><option value="Todos">Todos los distritos</option></select></label><button type="submit">Buscar</button></form></section>
  <div class="section-heading"><h2>Resultados <span id="result-count" class="count">—</span></h2></div>
  <div class="content-grid"><section id="results" class="result-list" aria-live="polite"><p>Cargando parques…</p></section></div>
</main>

<script src="/static/script.js"></script>
</body></html>
