<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2c3e50" />
    </marker>
    <marker id="subclass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 1, 10 5, 0 9" fill="#ffffff" stroke="#2980b9" stroke-width="1.5" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">Assignment 2a: Modelo RDFS e Instancias</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#64748b">Dominio Turístico y Administrativo | Alumno: Jaime Calero (jaimecalerooo)</text>

  <!-- SECTION 1: TBOX -->
  <rect x="20" y="70" width="960" height="380" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="35" y="95" font-size="14" font-weight="bold" fill="#1e293b">1. TBox (Clases y Propiedades RDFS)</text>

  <!-- Place -->
  <rect x="180" y="110" width="110" height="36" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="235" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#0369a1">:Place</text>

  <!-- PointOfInterest -->
  <rect x="165" y="175" width="140" height="36" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="235" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#0369a1">:PointOfInterest</text>
  <line x1="235" y1="175" x2="235" y2="146" stroke="#2980b9" stroke-width="1.5" marker-end="url(#subclass)"/>

  <!-- TouristicPlace & Accommodation & Bar -->
  <rect x="50" y="240" width="125" height="34" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="112" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#0369a1">:TouristicPlace</text>

  <rect x="190" y="240" width="120" height="34" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="250" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#0369a1">:Accommodation</text>

  <rect x="325" y="240" width="70" height="34" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#0369a1">:Bar</text>

  <line x1="112" y1="240" x2="195" y2="211" stroke="#2980b9" stroke-width="1.5" marker-end="url(#subclass)"/>
  <line x1="245" y1="240" x2="238" y2="211" stroke="#2980b9" stroke-width="1.5" marker-end="url(#subclass)"/>
  <line x1="345" y1="240" x2="275" y2="211" stroke="#2980b9" stroke-width="1.5" marker-end="url(#subclass)"/>

  <!-- Subclasses of TouristicPlace -->
  <rect x="30" y="305" width="60" height="28" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-dasharray="3,2"/>
  <text x="60" y="323" text-anchor="middle" font-size="11" fill="#0369a1">:Palace</text>
  <rect x="95" y="305" width="60" height="28" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-dasharray="3,2"/>
  <text x="125" y="323" text-anchor="middle" font-size="11" fill="#0369a1">:Church</text>
  <rect x="160" y="305" width="65" height="28" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="192" y="323" text-anchor="middle" font-size="11" fill="#0369a1">:Cathedral</text>

  <line x1="60" y1="305" x2="90" y2="274" stroke="#2980b9" stroke-width="1.2" marker-end="url(#subclass)"/>
  <line x1="125" y1="305" x2="115" y2="274" stroke="#2980b9" stroke-width="1.2" marker-end="url(#subclass)"/>
  <line x1="190" y1="305" x2="135" y2="274" stroke="#2980b9" stroke-width="1.2" marker-end="url(#subclass)"/>

  <!-- Subclasses of Accommodation -->
  <rect x="235" y="305" width="55" height="28" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-dasharray="3,2"/>
  <text x="262" y="323" text-anchor="middle" font-size="11" fill="#0369a1">:Hotel</text>
  <rect x="295" y="305" width="55" height="28" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-dasharray="3,2"/>
  <text x="322" y="323" text-anchor="middle" font-size="11" fill="#0369a1">:Hostel</text>

  <line x1="260" y1="305" x2="250" y2="274" stroke="#2980b9" stroke-width="1.2" marker-end="url(#subclass)"/>
  <line x1="320" y1="305" x2="270" y2="274" stroke="#2980b9" stroke-width="1.2" marker-end="url(#subclass)"/>

  <!-- Location Class -->
  <rect x="420" y="110" width="150" height="70" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="495" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">:Location</text>
  <line x1="420" y1="140" x2="570" y2="140" stroke="#fcd34d"/>
  <text x="430" y="157" font-size="11" fill="#78350f">+ streetName : xsd:string</text>
  <text x="430" y="172" font-size="11" fill="#78350f">+ number : xsd:integer</text>

  <!-- hasLocation edge -->
  <line x1="290" y1="128" x2="420" y2="128" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="355" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">:hasLocation</text>

  <!-- Administrative Entities -->
  <rect x="710" y="110" width="160" height="36" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="790" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">:AdministrativeUnit</text>

  <!-- Municipality, Province, AutonomousCommunity -->
  <rect x="610" y="200" width="130" height="55" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="675" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">:Municipality</text>
  <line x1="610" y1="228" x2="740" y2="228" stroke="#bbf7d0"/>
  <text x="618" y="244" font-size="10" fill="#14532d">+ population : xsd:integer</text>

  <rect x="760" y="200" width="90" height="36" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="805" y="223" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">:Province</text>

  <rect x="865" y="200" width="105" height="48" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="917" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">:Autonomous</text>
  <text x="917" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Community</text>

  <line x1="675" y1="200" x2="745" y2="146" stroke="#2980b9" stroke-width="1.5" marker-end="url(#subclass)"/>
  <line x1="805" y1="200" x2="795" y2="146" stroke="#2980b9" stroke-width="1.5" marker-end="url(#subclass)"/>
  <line x1="910" y1="200" x2="845" y2="146" stroke="#2980b9" stroke-width="1.5" marker-end="url(#subclass)"/>

  <!-- City subclass of Municipality -->
  <rect x="635" y="295" width="80" height="32" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="675" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">:City</text>
  <line x1="675" y1="295" x2="675" y2="255" stroke="#2980b9" stroke-width="1.5" marker-end="url(#subclass)"/>

  <!-- placedAt -->
  <line x1="570" y1="160" x2="630" y2="200" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="615" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">:placedAt</text>

  <!-- belongsTo links -->
  <line x1="740" y1="215" x2="760" y2="215" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="850" y1="215" x2="865" y2="215" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="780" y="190" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">:belongsTo</text>

  <!-- hasBorderWith loop -->
  <path d="M 620,255 C 600,285 580,265 610,240" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="565" y="285" font-size="10" fill="#4b5563">:hasBorderWith</text>

  <!-- Legend in TBox -->
  <g transform="translate(430, 365)">
    <rect x="0" y="0" width="530" height="70" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="10" y="20" font-size="11" font-weight="bold" fill="#334155">Leyenda y Decisiones de Modelado:</text>
    <line x1="15" y1="38" x2="45" y2="38" stroke="#2980b9" stroke-width="1.5" marker-end="url(#subclass)"/>
    <text x="55" y="42" font-size="11" fill="#475569">rdfs:subClassOf</text>
    <line x1="15" y1="56" x2="45" y2="56" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="55" y="60" font-size="11" fill="#475569">rdf:Property (hasLocation, placedAt)</text>
    <line x1="260" y1="38" x2="290" y2="38" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="300" y="42" font-size="11" fill="#dc2626">belongsTo (sin dominio/rango cerrados - Slide 48)</text>
  </g>


  <!-- SECTION 2: ABOX (INSTANCIAS) -->
  <rect x="20" y="470" width="960" height="290" rx="8" fill="#fefce8" stroke="#fef08a" stroke-width="1.5" />
  <text x="35" y="495" font-size="14" font-weight="bold" fill="#854d0e">2. ABox (Instancias Reales del Ejercicio)</text>

  <!-- Madrid & Community -->
  <rect x="700" y="520" width="130" height="50" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="765" y="542" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">:Madrid</text>
  <text x="765" y="558" text-anchor="middle" font-size="10" fill="#64748b">a :City</text>

  <rect x="680" y="615" width="170" height="35" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="765" y="637" text-anchor="middle" font-size="11" fill="#0f172a">:population "3166000"^^xsd:int</text>
  <line x1="765" y1="570" x2="765" y2="615" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="700" y="695" width="170" height="45" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="785" y="715" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">:MadridCommunity</text>
  <text x="785" y="730" text-anchor="middle" font-size="10" fill="#64748b">a :AutonomousCommunity</text>

  <line x1="785" y1="650" x2="785" y2="695" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="825" y="675" font-size="10" fill="#dc2626">:belongsTo</text>

  <!-- La Mirinda -->
  <rect x="50" y="520" width="120" height="45" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="542" text-anchor="middle" font-size="12" font-weight="bold" fill="#0369a1">:LaMirinda</text>
  <text x="110" y="556" text-anchor="middle" font-size="10" fill="#64748b">a :Bar</text>

  <rect x="230" y="520" width="200" height="70" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="330" y="540" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">:LaMirindaLocation</text>
  <text x="330" y="555" text-anchor="middle" font-size="10" fill="#64748b">a :Location</text>
  <text x="330" y="570" text-anchor="middle" font-size="10" fill="#78350f">:streetName "Plaza Dos de Mayo"</text>
  <text x="330" y="583" text-anchor="middle" font-size="10" fill="#78350f">:number 4</text>

  <line x1="170" y1="542" x2="230" y2="542" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="535" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">:hasLocation</text>

  <line x1="430" y1="550" x2="700" y2="545" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="540" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">:placedAt</text>

  <!-- Church 1 -->
  <rect x="50" y="650" width="140" height="45" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="120" y="672" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">:ChurchCalleAlcala43</text>
  <text x="120" y="686" text-anchor="middle" font-size="10" fill="#64748b">a :Church</text>

  <rect x="230" y="650" width="200" height="70" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="330" y="670" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">:ChurchCalleAlcala43Loc</text>
  <text x="330" y="685" text-anchor="middle" font-size="10" fill="#64748b">a :Location</text>
  <text x="330" y="700" text-anchor="middle" font-size="10" fill="#78350f">:streetName "Calle Alcalá"</text>
  <text x="330" y="713" text-anchor="middle" font-size="10" fill="#78350f">:number 43</text>

  <line x1="190" y1="672" x2="230" y2="672" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="665" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">:hasLocation</text>

  <line x1="430" y1="675" x2="700" y2="560" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="615" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">:placedAt</text>

</svg>
